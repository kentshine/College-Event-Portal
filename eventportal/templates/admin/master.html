{% extends 'admin/base.html' %}

{% block head_css %}
    {{ super() }}
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
        /* Custom Modern Aesthetic for Admin Desk */
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }

        /* Navbar Styling */
        .navbar {
            background: linear-gradient(135deg, #2c5282, #6ba3e7) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 15px 20px;
        }
        .navbar-brand {
            color: #ffffff !important;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }
        .navbar .nav-link {
            color: rgba(255,255,255,0.85) !important;
            font-weight: 500;
            font-size: 1.1rem;
            padding: 10px 15px !important;
            transition: color 0.2s;
        }
        .navbar .nav-link:hover {
            color: #ffffff !important;
        }
        .navbar .nav-item.active .nav-link {
            color: #ffffff !important;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        /* Sub-navigation tabs (List, Create) */
        .nav-tabs .nav-link {
            color: #2c5282;
            font-weight: 600;
        }
        .nav-tabs .nav-link.active {
            color: #333;
        }

        /* Tables and Panels */
        .table-responsive {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #eee;
        }
        table.table {
            border-collapse: separate;
            border-spacing: 0;
            border: none;
        }
        .table th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #eaeaea;
            border-top: none;
            padding: 15px;
        }
        .table td {
            vertical-align: middle;
            border-top: 1px solid #f0f0f0;
            padding: 15px;
            color: #444;
        }
        .table tbody tr:hover {
            background-color: #fafbfc;
        }

        /* Buttons */
        .btn-primary, .btn-default {
            background-color: #6ba3e7;
            border-color: #6ba3e7;
            color: white;
            font-weight: 600;
            border-radius: 6px;
            padding: 8px 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(107, 163, 231, 0.2);
        }
        .btn-primary:hover, .btn-default:hover {
            background-color: #2c5282;
            border-color: #2c5282;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(44, 82, 130, 0.3);
            color: white;
        }
        .btn-danger {
            background-color: #e63946;
            border-color: #e63946;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(230,57,70,0.2);
        }
        .btn-danger:hover {
            background-color: #c1121f;
            border-color: #c1121f;
        }

        /* Forms */
        .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 12px 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #6ba3e7;
            box-shadow: 0 0 0 3px rgba(107, 163, 231, 0.2);
        }

        /* General layout spacing */
        .container {
            max-width: 1200px;
            padding-top: 30px;
            padding-bottom: 50px;
        }
        .page-header {
            border-bottom: none;
            margin-bottom: 20px;
        }
        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2c5282;
        }
    </style>
{% endblock %}
